name: Dependabot Review
description: Prepare local review prompts or automate reviews for Dependabot updates
author: Maximilian Franzke
inputs:
  github-token:
    description: GitHub token with permission to read the PR and publish review comments
    required: true
  review-mode:
    description: Review mode, either prompt or openai
    default: prompt
  openai-api-key:
    description: OpenAI API key, required when review-mode is openai
    required: false
  openai-model:
    description: Exact OpenAI API model ID, required when review-mode is openai
    required: false
  openai-base-url:
    description: OpenAI-compatible API base URL
    default: https://api.openai.com/v1
  gitlab-token:
    description: Optional GitLab token for private upstream projects
    required: false
  create-fix-pr:
    description: Create or refresh a remediation PR when changes are required
    default: "false"
  max-context-characters:
    description: Maximum repository context sent to the model
    default: "600000"
  exclude:
    description: Newline-separated repository path globs to exclude
    required: false
outputs:
  review-comment-url:
    description: URL of the maintained review comment
  risk-level:
    description: Overall risk level in openai mode; empty in prompt mode
  fix-required:
    description: Whether openai mode found required code changes; empty in prompt mode
  fix-pr-url:
    description: URL of the remediation PR, when created
  dependencies-reviewed:
    description: Number of dependency updates reviewed
runs:
  using: node24
  main: src/index.ts
branding:
  icon: shield
  color: blue
