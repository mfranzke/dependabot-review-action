lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false
  dedupePeers: true

packageManager:
  name: pnpm
  version: 11.0.0

patchedDependencies:
  legacy-lib@1.0.0: abcdef012345

configDependencies:
  '@pnpm/trusted-deps':
    version: 0.1.0
    integrity: sha512-old

importers:
  .:
    dependencies:
      react:
        specifier: ^18.3.0
        version: 18.3.1
      local-package:
        specifier: workspace:*
        version: link:packages/local-package
    devDependencies:
      vite:
        specifier: ^5.4.0
        version: 5.4.10(@types/node@22.0.0)

packages:
  react@18.3.1:
    resolution:
      integrity: sha512-old
